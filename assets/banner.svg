<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="372" viewBox="0 0 820 372" role="img" aria-label="saisiddi detect-console boot banner">
<title>saisiddi@detect-console</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b1026"/>
    <stop offset="0.55" stop-color="#0c1c2e"/>
    <stop offset="1" stop-color="#07131f"/>
  </linearGradient>
  <linearGradient id="border" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#39ff88"/>
    <stop offset="0.5" stop-color="#56d4dd"/>
    <stop offset="1" stop-color="#39ff88"/>
  </linearGradient>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="6" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
    <path d="M28 0H0V28" fill="none" stroke="#1e3a4a" stroke-width="0.6" opacity="0.35"/>
  </pattern>
  <style>
    .mono { font-family: 'Fira Code','Consolas','Menlo',monospace; }
    .cursor { animation: blink 1.1s steps(1,end) infinite; }
    .pulse { animation: pulse 1.8s ease-in-out infinite; transform-origin: center; }
    @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
  </style>
</defs>

<rect x="3" y="3" width="814" height="366" rx="14" fill="none" stroke="url(#border)" stroke-width="2" filter="url(#glow)" opacity="0.9"/>
<rect x="6" y="6" width="808" height="360" rx="12" fill="url(#bg)"/>
<rect x="6" y="6" width="808" height="360" rx="12" fill="url(#grid)"/>

<!-- title bar -->
<rect x="6" y="6" width="808" height="38" rx="12" fill="#0d1b2e"/>
<rect x="6" y="32" width="808" height="12" fill="#0d1b2e"/>
<circle cx="30" cy="25" r="6" fill="#ff5f56"/>
